<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Menu | New Red Oven Caterers & Biryani Center</title>
<meta name="description" content="Browse the complete New Red Oven menu — Biryani, BBQ, Karahi, Handi, Fast Food and BBQ Rolls. Order for delivery, takeaway or dine-in.">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbarMount"></div>

<main>
  <section class="menu-hero">
    <div class="container">
      <h1>The Full Menu</h1>
      <p>Biryani, BBQ, Karahi, Handi, Fast Food and Rolls — everything New Red Oven serves, in one place.</p>
    </div>
  </section>

  <div class="menu-controls">
    <div class="container menu-controls-inner">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="menuSearch" placeholder="Search the menu...">
      </div>
      <div class="filter-tabs" id="filterTabs"></div>
      <button class="btn btn-gold btn-sm download-menu-btn" id="downloadMenuBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Menu
      </button>
    </div>
  </div>

  <section class="section" style="padding-top: 20px;">
    <div class="container" id="menuContainer"></div>
  </section>
</main>

<div id="footerMount"></div>
<div id="cartMount"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script>
  injectPartials("menu");

  let activeCategory = "all";
  let searchTerm = "";

  function renderFilterTabs() {
    const tabs = document.getElementById("filterTabs");
    const cats = [{ key: "all", label: "All" }, ...MENU.map(c => ({ key: c.key, label: c.label }))];
    tabs.innerHTML = cats.map(c =>
      `<button class="filter-tab ${activeCategory === c.key ? "active" : ""}" data-key="${c.key}">${c.label}</button>`
    ).join("");
    tabs.querySelectorAll(".filter-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.key;
        renderFilterTabs();
        renderMenu();
      });
    });
  }

  function renderMenu() {
    const container = document.getElementById("menuContainer");
    const term = searchTerm.trim().toLowerCase();

    const categories = activeCategory === "all" ? MENU : MENU.filter(c => c.key === activeCategory);

    let html = "";
    let totalMatches = 0;

    categories.forEach(cat => {
      const items = cat.items.filter(item => !term || item.name.toLowerCase().includes(term) || item.desc.toLowerCase().includes(term));
      if (items.length === 0) return;
      totalMatches += items.length;
      const itemsWithCat = items.map(i => ({ ...i, categoryLabel: cat.label }));
      html += `
        <div class="menu-category-block">
          <h2 class="menu-category-title">${cat.label}</h2>
          <div class="dish-grid">
            ${itemsWithCat.map(renderDishCard).join("")}
          </div>
        </div>
      `;
    });

    if (totalMatches === 0) {
      html = `
        <div class="no-results">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <p>No dishes found. Try a different search term.</p>
        </div>
      `;
    }

    container.innerHTML = html;

    // re-observe new cards for reveal animation
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("reveal");
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    container.querySelectorAll(".dish-card").forEach(el => observer.observe(el));
  }

  document.getElementById("menuSearch").addEventListener("input", (e) => {
    searchTerm = e.target.value;
    renderMenu();
  });

  document.getElementById("downloadMenuBtn").addEventListener("click", () => {
    const win = window.open("", "_blank");
    const dateStr = new Date().toLocaleDateString();
    let bodyHtml = "";
    MENU.forEach(cat => {
      bodyHtml += `<h2>${cat.label}</h2><table>`;
      cat.items.forEach(item => {
        const priceStr = item.variants.map(v => `${v.label}: Rs ${v.price.toLocaleString()}`).join(" &nbsp;/&nbsp; ");
        bodyHtml += `<tr><td class="name">${item.name}</td><td class="price">${priceStr}</td></tr>`;
      });
      bodyHtml += `</table>`;
    });

    win.document.write(`
      <html><head><title>New Red Oven — Menu</title>
      <style>
        body { font-family: Georgia, serif; color: #1a1414; padding: 40px; max-width: 800px; margin: 0 auto; }
        .header { text-align: center; border-bottom: 3px solid #c81e2c; padding-bottom: 20px; margin-bottom: 30px; }
        .header img { height: 80px; width: 80px; border-radius: 50%; }
        .header h1 { color: #c81e2c; margin: 10px 0 4px; }
        .header p { margin: 2px 0; color: #444; font-family: Arial, sans-serif; font-size: 13px; }
        h2 { color: #c81e2c; border-bottom: 1px solid #ddd; padding-bottom: 6px; margin-top: 30px; font-size: 18px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        td { padding: 6px 0; font-size: 14px; border-bottom: 1px dotted #ccc; font-family: Arial, sans-serif; }
        td.price { text-align: right; white-space: nowrap; font-weight: bold; color: #333; }
        .footer-note { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 3px solid #c81e2c; font-family: Arial, sans-serif; font-size: 13px; color: #555;}
        @media print { body { padding: 10px; } }
      </style></head>
      <body>
        <div class="header">
          <img src="${window.location.origin + window.location.pathname.replace('menu.html','')}images/logo.png" alt="logo">
          <h1>New Red Oven Caterers &amp; Biryani Center</h1>
          <p>${BUSINESS.address}</p>
          <p>Phone: ${BUSINESS.phoneDisplay} &nbsp;|&nbsp; ${dateStr}</p>
        </div>
        ${bodyHtml}
        <div class="footer-note">Payment: Cash Only &nbsp;|&nbsp; Delivery · Takeaway · Dine-in · Outdoor Seating</div>
      </body></html>
    `);
    win.document.close();
    setTimeout(() => win.print(), 400);
  });

  renderFilterTabs();
  renderMenu();
</script>
</body>
</html>
